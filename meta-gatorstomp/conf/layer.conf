# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-gatorstomp"
BBFILE_PATTERN_meta-gatorstomp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-gatorstomp = "6"

LAYERDEPENDS_meta-gatorstomp = "core"
LAYERSERIES_COMPAT_meta-gatorstomp = "scarthgap"
